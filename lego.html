<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lego Collection — Shrikar Swami</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#141414;
  --plate:#c4c4c4;
  --plate-stud:#efefef;
  --yellow:#ffd500;
  --yellow-dark:#c9a400;
  --red:#e3000b;
  --red-dark:#a30008;
  --blue:#0057b8;
  --blue-dark:#003e86;
  --green:#00852b;
  --green-dark:#005c1e;
  --orange:#ff7e14;
  --orange-dark:#c85a00;
  --azure:#0099d8;
  --azure-dark:#0077a8;
  --black:#222;
  --black-dark:#0d0d0d;
  --white:#f6f6f4;
  --white-dark:#cfcfc8;
  --font:'Nunito',system-ui,sans-serif;
  --display:'Fredoka',system-ui,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  min-height:100vh;
  color:var(--ink);
  font-family:var(--font);
  background-color:#bdbdbd;
  background-image:radial-gradient(circle at 14px 14px, #f7f7f7 0 5px, #e6e6e6 6.5px, #a3a3a3 8px, transparent 8.6px);
  background-size:28px 28px;
  background-attachment:fixed;
}
img{max-width:100%;display:block}
a{color:inherit}
:focus-visible{outline:3px solid var(--ink);outline-offset:3px}

.top{
  --plastic:var(--yellow);
  --plastic-dark:var(--yellow-dark);
  position:sticky;top:0;z-index:20;
  background:var(--yellow);
  box-shadow:inset 0 -7px 0 var(--yellow-dark), 0 10px 18px rgba(20,24,28,.16);
}
.top-inner{
  max-width:1180px;margin:0 auto;
  display:flex;align-items:center;justify-content:space-between;gap:18px;
  padding:14px 22px 16px;
}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font-family:var(--display);font-weight:700;font-size:1.35rem;letter-spacing:-.03em}
.brand img{width:42px;height:42px;border-radius:6px}
.navlinks{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:flex-end}
.navlinks a{text-decoration:none;font-weight:800;font-size:.95rem}
.navlinks a:hover{text-decoration:underline;text-underline-offset:3px}

.wrap{max-width:1180px;margin:0 auto;padding:28px 22px 64px}

.plate{
  --plastic:var(--yellow);
  --plastic-dark:var(--yellow-dark);
  background:var(--plastic);
  border-radius:3px 3px 8px 8px;
  padding:0 22px 22px;
  box-shadow:inset 0 -9px 0 var(--plastic-dark), 0 12px 0 rgba(20,24,28,.06), 0 16px 28px rgba(20,24,28,.12);
}
.plate.red{--plastic:var(--red);--plastic-dark:var(--red-dark);color:#fff}
.plate.blue{--plastic:var(--blue);--plastic-dark:var(--blue-dark);color:#fff}
.studs{display:flex;justify-content:space-evenly;align-items:flex-end;height:12px;margin:0 10px 10px;pointer-events:none}
.studs i{
  width:26px;height:12px;flex:0 0 26px;
  border-radius:2px 2px 0 0;
  background:var(--plastic-dark);
}
.top .pill,.money .pill{
  background:var(--ink);color:var(--yellow);
  box-shadow:inset 0 -4px 0 #000, 0 5px 0 rgba(0,0,0,.18);
}
.top .pill:hover,.money .pill:hover{box-shadow:inset 0 -4px 0 #000, 0 8px 0 rgba(0,0,0,.16)}

.nameplate{margin-bottom:22px;padding-top:22px}
.nameplate h1{
  position:relative;
  display:inline-block;
  font-family:var(--display);
  font-size:clamp(2.4rem,5.4vw,4.1rem);
  font-weight:600;
  letter-spacing:-.03em;
  line-height:1.12;
  text-wrap:balance;
  max-width:14ch;
}
.nameplate h1 .outline,
.nameplate h1 .face{display:block}
.nameplate h1 .outline{
  position:absolute;inset:0;
  color:transparent;
  -webkit-text-stroke:12px #111;
}
.nameplate h1 .face{
  position:relative;
  color:#fff;
  -webkit-text-stroke:4px #ffe14a;
  paint-order:stroke fill;
}
.money{
  margin-top:14px;
  max-width:38rem;
  font-size:clamp(1.15rem,2vw,1.45rem);
  font-weight:800;
  line-height:1.35;
}
.money .pill{margin-left:8px;vertical-align:middle}

.pill{
  display:inline-flex;align-items:center;justify-content:center;
  background:var(--yellow);color:var(--ink);
  font-family:var(--display);font-weight:700;font-size:1.05rem;
  text-decoration:none;
  padding:10px 18px;border-radius:999px;
  box-shadow:inset 0 -4px 0 var(--yellow-dark), 0 6px 0 rgba(0,0,0,.12);
  transition:transform .18s cubic-bezier(.2,.7,.2,1), box-shadow .18s;
}
.pill:hover{transform:translateY(-2px);box-shadow:inset 0 -4px 0 var(--yellow-dark), 0 10px 0 rgba(0,0,0,.1)}
.pill:active{transform:translateY(2px);box-shadow:inset 0 -2px 0 var(--yellow-dark), 0 2px 0 rgba(0,0,0,.12)}
.plate.red .pill,.plate.blue .pill{color:var(--ink)}

.build{
  column-count:3;
  column-gap:14px;
}
.brick{
  --plastic:var(--red);
  --plastic-dark:var(--red-dark);
  position:relative;
  appearance:none;border:0;padding:10px 10px 12px;width:100%;
  display:block;break-inside:avoid;margin:18px 0 8px;
  background:var(--plastic);color:inherit;text-align:left;cursor:zoom-in;
  border-radius:2px 2px 6px 6px;
  box-shadow:inset 0 -7px 0 var(--plastic-dark);
  transition:transform .2s cubic-bezier(.2,.7,.2,1);
}
.brick > .studs{position:absolute;top:-12px;left:12px;right:12px;height:12px;margin:0}
.brick:hover,.brick:focus-visible{transform:translateY(-4px);z-index:2}
.brick img{width:100%;height:auto;border-radius:2px}
.brick.blue{--plastic:var(--blue);--plastic-dark:var(--blue-dark)}
.brick.green{--plastic:var(--green);--plastic-dark:var(--green-dark)}
.brick.orange{--plastic:var(--orange);--plastic-dark:var(--orange-dark)}
.brick.yellow{--plastic:var(--yellow);--plastic-dark:var(--yellow-dark)}
.brick.azure{--plastic:var(--azure);--plastic-dark:var(--azure-dark)}
.brick.black{--plastic:var(--black);--plastic-dark:var(--black-dark)}
.brick.white{--plastic:var(--white);--plastic-dark:var(--white-dark)}

.shelf{margin-top:36px}
.shelf h2{font-family:var(--display);font-size:clamp(1.8rem,3vw,2.4rem);letter-spacing:-.03em;font-weight:700}
.shelf p{margin:8px 0 16px;font-weight:800;font-size:1.08rem;max-width:42rem;line-height:1.4}

.foot{
  --plastic:var(--black);--plastic-dark:var(--black-dark);
  color:#fff;text-align:center;margin-top:28px;
}
.foot p{font-family:var(--display);letter-spacing:.08em;font-size:.95rem;padding-bottom:4px}

.viewer{
  position:fixed;inset:0;z-index:40;
  background:rgba(18,22,26,.82);
  display:flex;align-items:center;justify-content:center;gap:14px;
  padding:28px 16px 56px;
}
.viewer[hidden]{display:none}
.viewer-brick{
  --plastic:var(--white);--plastic-dark:var(--white-dark);
  position:relative;
  margin:14px 0 0;max-width:min(1100px,88vw);
  background:var(--white);padding:10px 12px 14px;
  border-radius:2px 2px 8px 8px;
  box-shadow:inset 0 -8px 0 var(--white-dark), 0 24px 50px rgba(0,0,0,.35);
}
.viewer-brick > .studs{position:absolute;top:-12px;left:16px;right:16px;height:12px;margin:0}
.viewer-brick img{width:auto;height:auto;max-width:min(1070px,84vw);max-height:78vh;margin:0 auto;border-radius:2px}
.viewer-count{margin-top:10px;text-align:center;font-weight:800;letter-spacing:.12em;font-size:.8rem}
.round{
  appearance:none;border:0;cursor:pointer;
  width:52px;height:52px;border-radius:50%;flex:none;
  background:var(--yellow);color:var(--ink);
  font-family:var(--display);font-size:1.8rem;line-height:1;
  box-shadow:inset 0 -4px 0 var(--yellow-dark), 0 6px 0 rgba(0,0,0,.25);
}
.round:hover{transform:translateY(-2px)}
.viewer-x{position:absolute;top:18px;right:18px}

@media(max-width:800px){
  .build{column-count:2}
  .top-inner{align-items:flex-start;flex-direction:column;gap:8px}
}
@media(max-width:520px){
  .build{column-count:1}
  .viewer{gap:8px;padding:72px 8px 24px}
  .round{width:42px;height:42px}
  .viewer-brick img{max-width:86vw}
}
@media(prefers-reduced-motion:reduce){
  .brick,.pill,.round{transition:none}
  html{scroll-behavior:auto}
}
</style>
</head>
<body>
<!--
THESIS: The collection is a model on the table, not a dark portfolio section. Refuse the cropped card grid.
OWN-WORLD: Light studded baseplate. Yellow, red, blue, green, orange, and black ABS bricks with round studs and a darker lower lip. Fredoka titles, Nunito body. Yellow round buttons.
STORY: These are the builds. The money line points at Hire me. BrickEconomy is the live shelf.
FIRST VIEWPORT: A yellow brick bar, then a yellow nameplate brick with the title and hire button, then the colored photo bricks filling the width.
FORM: Brick wall on a baseplate, the pinned brief. Seed skipped because the brief named the world.
FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, and DESIGN.md
-->
<header class="top">
  <div class="top-inner">
    <a class="brand" href="index.html"><img src="assets/logos/lego.svg" alt=""><span>Shrikar</span></a>
    <nav class="navlinks" aria-label="Site">
      <a href="index.html#about">About</a>
      <a href="index.html#projects">Projects</a>
      <a href="index.html#experience">Experience</a>
      <a href="index.html#gallery">Life</a>
      <a href="index.html#vault">Repos</a>
      <a href="index.html#beyond">Beyond</a>
      <a href="index.html#trophies">Awards</a>
      <a class="pill" href="index.html#contact">Hire me</a>
    </nav>
  </div>
</header>

<main class="wrap">
  <section class="plate nameplate">
    <h1><span class="outline" aria-hidden="true">Lego collection.</span><span class="face">Lego collection.</span></h1>
    <p class="money">If you were ever curious where all my money went. <a class="pill" href="index.html#contact">Hire me</a></p>
  </section>

  <div class="build" id="build">
    <button class="brick red" type="button">
      <div class="studs" aria-hidden="true"></div>
      <img src="assets/lego/01.jpg" alt="Avengers Lego display with Hulkbuster, Iron Man, Thor, Hulk, Thanos, and Doctor Strange">
    </button>
    <button class="brick blue" type="button">
      <div class="studs" aria-hidden="true"></div>
      <img src="assets/lego/02.png" alt="Holding a LEGO shopping bag in front of a brick wall">
    </button>
    <button class="brick green" type="button">
      <div class="studs" aria-hidden="true"></div>
      <img src="assets/lego/03.jpg" alt="MARVEL logo between the Infinity Gauntlet and the Nano Gauntlet">
    </button>
    <button class="brick orange" type="button">
      <div class="studs" aria-hidden="true"></div>
      <img src="assets/lego/04.jpg" alt="A curly dog on a couch between two oversized Lego figures">
    </button>
    <button class="brick yellow" type="button">
      <div class="studs" aria-hidden="true"></div>
      <img src="assets/lego/05.jpg" alt="Ant-Man and a white jet in an airport Lego scene">
    </button>
    <button class="brick azure" type="button">
      <div class="studs" aria-hidden="true"></div>
      <img src="assets/lego/06.jpg" alt="Spider-Man street with the Daily Bugle, Oscorp, and a PDNY car">
    </button>
    <button class="brick black" type="button">
      <div class="studs" aria-hidden="true"></div>
      <img src="assets/lego/07.jpg" alt="Spider-Man on a subway car with Doctor Octopus overhead">
    </button>
    <button class="brick white" type="button">
      <div class="studs" aria-hidden="true"></div>
      <img src="assets/lego/08.jpg" alt="Daily Bugle news screen with Daredevil in front">
    </button>
    <button class="brick red" type="button">
      <div class="studs" aria-hidden="true"></div>
      <img src="assets/lego/09.jpg" alt="Carnage above a news stand">
    </button>
    <button class="brick blue" type="button">
      <div class="studs" aria-hidden="true"></div>
      <img src="assets/lego/10.jpg" alt="Spider-Man swinging past Doctor Octopus and the Green Goblin">
    </button>
    <button class="brick green" type="button">
      <div class="studs" aria-hidden="true"></div>
      <img src="assets/lego/11.jpg" alt="Holding a LEGO bag next to a green brick sculpture in a LEGO store">
    </button>
    <button class="brick orange" type="button">
      <div class="studs" aria-hidden="true"></div>
      <img src="assets/lego/12.jpg" alt="Face in the mouth of a giant yellow brick dinosaur">
    </button>
    <button class="brick yellow" type="button">
      <div class="studs" aria-hidden="true"></div>
      <img src="assets/lego-avatar.jpg" alt="Lego minifigure avatar in a suit">
    </button>
  </div>

  <section class="plate blue shelf">
    <div class="studs" aria-hidden="true"></div>
    <h2>Live collection</h2>
    <p>The live shelf. Counts and sets stay current on BrickEconomy.</p>
    <a class="pill" href="https://www.brickeconomy.com/member/LegoShrikar" target="_blank" rel="noopener">BrickEconomy collection</a>
  </section>

  <footer class="plate foot">
    <div class="studs" aria-hidden="true"></div>
    <p>BUILT WITH CAFFEINE AND LOVE</p>
  </footer>
</main>

<div class="viewer" id="viewer" hidden role="dialog" aria-modal="true" aria-label="Lego photo">
  <button class="round viewer-x" type="button" aria-label="Close">×</button>
  <button class="round viewer-prev" type="button" aria-label="Previous photo">‹</button>
  <figure class="viewer-brick">
    <div class="studs" aria-hidden="true"></div>
    <img id="viewerImg" alt="">
    <figcaption class="viewer-count" id="viewerCount"></figcaption>
  </figure>
  <button class="round viewer-next" type="button" aria-label="Next photo">›</button>
</div>

<script>
(function () {
  const bricks = [...document.querySelectorAll('.brick, .plate, .top')];
  function fillStuds(el) {
    const row = el.querySelector(':scope > .studs, :scope > .top-studs');
    if (!row) return;
    const width = el.clientWidth || row.parentElement.clientWidth;
    const n = Math.max(2, Math.min(24, Math.floor((width - 20) / 40)));
    row.replaceChildren(...Array.from({ length: n }, () => document.createElement('i')));
  }
  function studs() { bricks.forEach(fillStuds); }
  studs();
  addEventListener('resize', studs);

  function shuffle(list) {
    const a = list.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      const t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  const build = document.getElementById('build');
  const stamp = list => list.map(btn => btn.querySelector('img').getAttribute('src')).join('|');
  let buttons = [...build.querySelectorAll('.brick')];
  let previous = '';
  try { previous = localStorage.getItem('lego-browse-order') || ''; } catch (err) {}
  let order = shuffle(buttons);
  for (let guard = 0; stamp(order) === previous && guard < 12; guard++) order = shuffle(buttons);
  try { localStorage.setItem('lego-browse-order', stamp(order)); } catch (err) {}
  order.forEach(btn => build.appendChild(btn));
  buttons = order;
  const viewer = document.getElementById('viewer');
  const img = document.getElementById('viewerImg');
  const count = document.getElementById('viewerCount');
  const viewerStuds = viewer.querySelector('.studs');
  let cursor = 0;
  let open = false;

  function render() {
    const photo = buttons[cursor].querySelector('img');
    img.src = photo.src;
    img.alt = photo.alt;
    count.textContent = (cursor + 1) + ' / ' + buttons.length;
    const n = Math.max(4, Math.min(18, Math.floor(Math.min(window.innerWidth * 0.7, 900) / 40)));
    viewerStuds.replaceChildren(...Array.from({ length: n }, () => document.createElement('i')));
  }
  function show(index) {
    cursor = (index + buttons.length) % buttons.length;
    open = true;
    viewer.hidden = false;
    document.body.style.overflow = 'hidden';
    render();
    viewer.querySelector('.viewer-x').focus();
  }
  function hide() {
    open = false;
    viewer.hidden = true;
    img.removeAttribute('src');
    document.body.style.overflow = '';
  }
  buttons.forEach((btn, i) => {
    const photo = btn.querySelector('img');
    btn.setAttribute('aria-label', photo.alt || 'Open photo');
    btn.addEventListener('click', () => show(i));
  });
  viewer.querySelector('.viewer-prev').addEventListener('click', () => { cursor = (cursor - 1 + buttons.length) % buttons.length; render(); });
  viewer.querySelector('.viewer-next').addEventListener('click', () => { cursor = (cursor + 1) % buttons.length; render(); });
  viewer.querySelector('.viewer-x').addEventListener('click', hide);
  viewer.addEventListener('click', e => { if (e.target === viewer) hide(); });
  addEventListener('keydown', e => {
    if (!open) return;
    if (e.key === 'Escape') hide();
    else if (e.key === 'ArrowLeft') { cursor = (cursor - 1 + buttons.length) % buttons.length; render(); }
    else if (e.key === 'ArrowRight') { cursor = (cursor + 1) % buttons.length; render(); }
  });
})();
</script>
</body>
</html>
